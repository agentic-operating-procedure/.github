name: Programme change
description: Raise a question about the estate, the phase plan, or a repository boundary.
title: "[programme] "
labels: ["research-proposal"]
body:
  - type: textarea
    id: question
    attributes:
      label: What needs to change
      description: The question or proposal, stated in one paragraph.
    validations:
      required: true
  - type: input
    id: boundary
    attributes:
      label: Which repository owns this
      description: The repository whose single authority this belongs to.
      placeholder: "aop-governance"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why the current arrangement does not work
      description: What is blocked, ambiguous, or duplicated today.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: What else could be done, and the trade-off of each.
    validations:
      required: true
